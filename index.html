<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonicfield — 1,391 records, sorted into crates</title>
<meta name="description" content="A record-shop dig through rock and its descendants, 1960–2010. Pull a sleeve, play it in Apple Music, mark it heard.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>Sonic<i>field</i></h1>
  <input id="q" type="search" placeholder="Artist or album" aria-label="Search records" autocomplete="off">
  <div class="chips" id="dec" role="group" aria-label="Decade"></div>
  <div class="chips" id="hf" role="group" aria-label="Heard filter">
    <button data-h="all" aria-pressed="true">All</button><button data-h="no" aria-pressed="false">Unheard</button><button data-h="yes" aria-pressed="false">Heard</button>
  </div>
  <button id="pull" class="pull">Pull one</button>
</header>
<nav id="rail" aria-label="Crates"></nav>
<main id="wall"><p class="load">Sorting the crates…</p></main>
<aside id="sheet" aria-hidden="true" aria-label="Record detail"></aside>
<div id="veil"></div>
<script type="module" src="app.js"></script>
</body>
</html>

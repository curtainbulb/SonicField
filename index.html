<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0614">
<title>SONICFIELD // 1,391 sleeves, 37 crates</title>
<meta name="description" content="A terminal for digging through rock and its descendants, 1960–2010. Pull a sleeve, play it in Apple Music, log it.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>SONIC<i>FIELD</i><small id="cnt" aria-live="polite">booting…</small></h1>
  <input id="q" type="search" placeholder="> search" aria-label="Search records" autocomplete="off" spellcheck="false">
  <div class="chips" id="dec" role="group" aria-label="Decade"></div>
  <div class="chips" id="hf" role="group" aria-label="Filter">
    <button data-h="all" aria-pressed="true">All</button><button data-h="no" aria-pressed="false">Unheard</button><button data-h="yes" aria-pressed="false">Heard</button><button data-h="unrated" aria-pressed="false">Unrated</button><button data-h="untagged" aria-pressed="false">Untagged</button><button data-h="flag" aria-pressed="false">Flagged</button>
  </div>
  <button id="sb" class="pull alt">Stats</button><button id="pull" class="pull">Pull one</button>
</header>
<nav id="rail" aria-label="Crates"></nav>
<main id="wall"><p class="load">&gt; sorting crates<span class="cur">_</span></p></main>
<section id="stats" aria-label="Total stats"></section>
<aside id="sheet" role="dialog" aria-modal="true" aria-label="Record detail" aria-hidden="true"></aside>
<div id="veil"></div>
<script type="module" src="app.js"></script>
</body>
</html>
